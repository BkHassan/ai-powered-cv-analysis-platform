# Backend stack: NestJS API + ChromaDB.
# Dokploy: Compose Path ./docker-compose.backend.yml — attach a domain to
# service "backend", port 3003. Traefik labels are injected by Dokploy.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Namespaced so it cannot collide with the image name docker-compose.yml
    # derives for the dev build (craftmind-backend).
    image: craftmind/backend:latest
    env_file:
      - .env
    init: true
    volumes:
      - cv_files:/app/dist/Cvfiles
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dokploy-network
      - back-tier

  chromadb:
    # Pinned: the chromadb 1.x JS client speaks the /api/v1 protocol, which
    # Chroma server removed in 1.0 (it answers those routes with 410 Gone).
    image: chromadb/chroma:0.5.23
    init: true
    # Not published: Chroma has no auth; only the backend may reach it.
    expose:
      - "8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_DB=duckdb
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test:
        ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 15s
      retries: 50
      start_period: 300s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - back-tier

volumes:
  chromadb_data:
    driver: local
  cv_files:
    driver: local

networks:
  dokploy-network:
    external: true
  back-tier:
    driver: bridge
