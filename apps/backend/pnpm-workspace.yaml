# Postinstall scripts pnpm is allowed to run. pnpm 11 fails the install with
# ERR_PNPM_IGNORED_BUILDS unless each one is decided explicitly, so this file is
# copied into the Docker image alongside the lockfile.
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@swc/core'
