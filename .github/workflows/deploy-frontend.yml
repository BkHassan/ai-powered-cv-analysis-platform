name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "docker-compose.frontend.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and restart the frontend stack over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --prune origin main
            git reset --hard origin/main
            # --env-file supplies the NEXT_PUBLIC_* build args, which Next.js
            # inlines into the client bundle at build time.
            docker compose -f docker-compose.frontend.yml --env-file .env.frontend up -d --build
            docker image prune -f
