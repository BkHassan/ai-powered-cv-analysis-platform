services:
  chromadb:
    build:
      context: .
      dockerfile: Dockerfile.chroma
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - ALLOW_RESET=TRUE
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://chromadb:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ai-cv-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ai_cv_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - JWT_SECRET=my-secret-key
    depends_on:
      chromadb:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    networks:
      - ai-cv-network

volumes:
  chromadb_data:
    driver: local

networks:
  ai-cv-network:
    driver: bridge