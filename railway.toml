# Optional: deploy the backend on Railway instead of a VPS.
# Add a second service for the vector store using image chromadb/chroma:0.5.23 —
# not :latest, the 1.x server dropped the /api/v1 protocol this client needs.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"
watchPatterns = ["apps/backend/**", "Dockerfile.backend"]

[deploy]
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"
healthcheckTimeout = 300
