# Edge proxy: terminates TLS and routes the two public hostnames to the
# frontend and backend stacks. Certificates are obtained and renewed
# automatically from Let's Encrypt.
#   docker compose -f docker-compose.proxy.yml --env-file .env.proxy up -d
name: craftmind-proxy

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?set APP_DOMAIN in .env.proxy}
      - API_DOMAIN=${API_DOMAIN:?set API_DOMAIN in .env.proxy}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env.proxy}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge

# caddy_data holds the issued certificates — losing it means re-issuing, which
# is rate limited by Let's Encrypt.
volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  # Must match EDGE_NETWORK in the backend/frontend stacks. Only needed when
  # self-hosting the proxy; on Dokploy its Traefik replaces this whole stack.
  edge:
    name: ${EDGE_NETWORK:-edge}
    external: true
