services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3003:3003"
    env_file:
      - .env
    volumes:
      - ./apps/backend/Cvfiles:/app/dist/Cvfiles
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - back-tier

  chromadb:
    image: chromadb/chroma:0.5.23
    # Deliberately not published: Chroma has no auth, and the backend reaches it
    # over the compose network.
    expose:
      - "8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_DB=duckdb
    healthcheck:
      test:
        ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 15s
      retries: 50
      start_period: 300s
    restart: unless-stopped
    networks:
      - back-tier

volumes:
  chromadb_data:
    driver: local

networks:
  back-tier:
    driver: bridge
